aid: worklittle
name: Worklittle
description: 'Worklittle is a workforce-intelligence platform covering job discovery, auto-apply, embedded
  careers boards, ATS sync and sourcing over one API. It splits into two halves: Jobs, the market-wide
  index plus candidate-facing apply and document tools including commute search on a geocoded job map,
  and Business, an employer hiring workspace with postings, an ATS pipeline, employees, HR documents and
  webhooks. The public contract is a $ref-based OpenAPI 3.1 document served from docs.worklittle.com/openapi/openapi.yaml
  resolving to 47 paths across jobs, platform and job-board surfaces on api.worklittle.com, with bearer
  sk-wl-api01 authentication plus an OAuth 2.0 authorization server (RFC 8414, PKCE, dynamic registration)
  backing MCP Connect. Worklittle operates a live remote MCP server at mcp.worklittle.com (101 documented
  tools, 13 anonymously introspectable), ships first-party TypeScript and Python SDKs and a CLI on npm,
  PyPI and Homebrew, and publishes a 99KB llms.txt plus a docs agent manifest.'
