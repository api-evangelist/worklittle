aid: worklittle
name: Worklittle
description: >-
  Worklittle is a workforce-intelligence platform covering job discovery, auto-apply, embedded
  careers boards, ATS sync and sourcing over one API. It splits into two halves: Jobs, the
  market-wide index plus candidate-facing apply and document tools including commute search on a
  geocoded job map, and Business, an employer hiring workspace with postings, an ATS pipeline,
  employees, HR documents and webhooks. The public contract is an OpenAPI 3.1 document of 59 paths
  and 59 operations served from api.worklittle.com with bearer authentication. Worklittle also
  operates an MCP server documented for Cursor, Claude and VS Code, and publishes a 1.4MB agent
  manifest alongside a 97KB llms.txt.
