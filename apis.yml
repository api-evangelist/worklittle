  source: https://docs.worklittle.com/llms.txt
  note: 'Submitted via apis.io/add on 2026-08-24 and auto-published by the gate at rating 15. THE SUBMITTED
    APIs.json URL IS NOT A DOCUMENT. https://docs.worklittle.com/apis.json returns 200 and differs from
    a control path, which is why it survives a naive check — but the body is HTML, the docs overview page.
    Distinctness from a control is NOT sufficient on a host that renders unknown routes; the content type
    has to be read too. The real locations came from the provider''s own llms.txt, which names them: the
    specification at /openapi/openapi.yaml and an agent manifest at /docs-agent-manifest.json. THE SPECIFICATION
    IS $REF-BASED AND THE ROOT FILE IS ONLY 5.8KB. It declares 59 paths and zero inline operations; every
    path is a $ref into one of three sibling documents. All three were fetched and all three resolve:
    paths/jobs.yaml (10 operations), paths/platform.yaml (41), and job-boards.yaml (8) — note the last
    sits at the openapi/ root, NOT under paths/, which is what the $ref actually says. Reading the root
    file alone would report an API with no operations at all; the 59 here is the resolved count. One caution
    for anyone re-harvesting: this host returns a 5,636-byte HTML page with HTTP 200 for any path that
    does not exist, including inside openapi/paths/. A guessed filename comes back looking like a successful
    fetch. Follow the $ref values, do not guess.'
