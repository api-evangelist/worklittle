          type: string
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '400':
          $ref: ../openapi.yaml#/components/schemas/Error
  /business/emails:
    get:
      tags:
      - email-offers
      summary: Email templates CRUD
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '400':
          $ref: ../openapi.yaml#/components/schemas/Error
  /business/emails/sent:
    get:
      tags:
      - email-offers
      summary: List org sent emails (ATS + automation) with open stats
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ats
          - automation
          - all
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: integer
      - in: query
        name: until
        schema:
          type: integer
      - in: query
        name: candidate_id
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          description: OK
        '400':
          $ref: ../openapi.yaml#/components/schemas/Error
  /business/emails/sent/{id}:
    get:
      tags:
      - email-offers
      summary: Get one sent email with open rollups
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          $ref: ../openapi.yaml#/components/schemas/Error
  /usage:
    get:
      tags:
      - billing
      summary: Usage / audit logs with Destination fields (where_label, where_href). Same stream as Business Usage.
      description: 'Returns organization_logs (default source=all) including metered AI, free burns, and org activity.
        Each row may include where_label / where_href (Chat and Voice open absolute chat URLs when chat_id is known;
        Private has no link; job/survey/candidate destinations use product paths). Filter with source=public_api|platform_ai|org_activity
        for single-source cursor pagination (platform_ai and org_activity include where_*).

        '
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: source
        schema:
          type: string
          enum:
          - all
          - public_api
          - platform_ai
          - platform_fees
          - org_activity
      - in: query
        name: since
        schema:
          type: integer
      - in: query
        name: until
        schema:
          type: integer
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: api_key_id
        schema:
          type: string
      - in: query
        name: route
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: ../openapi.yaml#/components/schemas/Error
