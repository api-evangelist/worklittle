      summary: List or create job listings (POST)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '400':
          $ref: ../openapi.yaml#/components/schemas/Error
  /business/jobs/{id}:
    patch:
      tags:
