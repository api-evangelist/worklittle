# Platform / ATS / people / webhooks / docs path items

jobsApply:
  post:
    tags: [apply]
    summary: API-key apply to hosted job
    security: [{bearerAuth: []}]
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    responses:
      "200": {description: OK}
      "201": {description: Created}
      "400": {$ref: "../openapi.yaml#/components/schemas/Error"}

appliedJobs:
  get:
    tags: [apply]
    summary: List applied jobs
    security: [{bearerAuth: []}]
    parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: status
        in: query
        description: Pipeline stage filter
        schema:
          type: string
          enum:
            [
              saved,
              in_progress,
              applied,
              interview,
              offer,
              rejected,
              withdrawn,
              skipped,
              viewed,
            ]
      - name: fields
        in: query
        schema: {type: string, enum: [lite, full], default: lite}
    responses:
      "200": {description: OK — count, jobs, has_more}
      "201": {description: Created}
      "400": {$ref: "../openapi.yaml#/components/schemas/Error"}

appliedJobsCounts:
  get:
    tags: [apply]
    summary: Applied jobs board totals by stage
    description: >
      Cheap totals for /saved column badges. Returns `total` plus `by_status`
      for every pipeline stage. Does not return job cards.
    security: [{bearerAuth: []}]
    responses:
      "200": {description: OK — total, by_status}
      "400": {$ref: "../openapi.yaml#/components/schemas/Error"}

