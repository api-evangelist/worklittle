usage:
  get:
    tags: [billing]
    summary: Usage / audit logs with Destination fields (where_label, where_href). Same stream as Business Usage.
    description: >
      Returns organization_logs (default source=all) including metered AI, free burns, and org activity.
      Each row may include where_label / where_href (Chat and Voice open absolute chat URLs when chat_id is known;
      Private has no link; job/survey/candidate destinations use product paths).
      Filter with source=public_api|platform_ai|org_activity for single-source cursor pagination
      (platform_ai and org_activity include where_*).
    security: [{bearerAuth: []}]
    parameters:
      - in: query
        name: source
        schema: {type: string, enum: [all, public_api, platform_ai, platform_fees, org_activity]}
      - in: query
        name: since
        schema: {type: integer}
      - in: query
        name: until
        schema: {type: integer}
      - in: query
        name: cursor
        schema: {type: string}
      - in: query
        name: limit
        schema: {type: integer}
      - in: query
        name: api_key_id
        schema: {type: string}
      - in: query
        name: route
        schema: {type: string}
      - in: query
        name: status
        schema: {type: string}
    responses:
      "200": {description: OK}
      "401": {$ref: "../openapi.yaml#/components/schemas/Error"}

